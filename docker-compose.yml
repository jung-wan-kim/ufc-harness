services:
  redis:
    image: redis:7-alpine
    container_name: ufc-redis
    ports:
      - '6379:6379'
    command: ['redis-server', '--save', '20', '1', '--loglevel', 'warning']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
