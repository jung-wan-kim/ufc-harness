project_id = "ufc-harness"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://ufc-harness.vercel.app"]
jwt_expiry = 3600
enable_signup = true

[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_CLIENT_SECRET)"
redirect_uri = "https://hihafrpktdotahsbcqfa.supabase.co/auth/v1/callback"

[functions.dispatch-challenge]
verify_jwt = false  # pg_cron에서 호출 (내부 토큰으로 검증)

[functions.upload-result]
verify_jwt = false  # GHA에서 호출 (submission_tokens로 검증)

[functions.judge-submission]
verify_jwt = false  # pg_boss worker에서 호출
